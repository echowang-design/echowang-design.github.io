<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9e8e4">
<meta name="description" content="Echo Wang — Game Visual Designer portfolio.">
<title>Echo Wang — Game Visual Designer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="site-noise" aria-hidden="true"></div>
<header class="topbar">
  <button class="brand" id="brandHome" aria-label="Home">ECHO WANG</button>
  <div class="top-right">
    <button class="top-link" id="worldBtn">WORLD</button>
    <button class="top-link" id="projectsBtn">PROJECTS</button>
    <button class="top-link" id="aboutBtn">ABOUT</button>
    <div class="language-switcher">
      <button class="lang-button" id="langButton" aria-expanded="false">中 <span>⌄</span></button>
      <div class="lang-menu" id="langMenu">
        <button data-lang="zh-CN">简体中文</button>
        <button data-lang="zh-TW">繁體中文</button>
        <button data-lang="en">English</button>
        <button data-lang="ko">한국어</button>
      </div>
    </div>
  </div>
</header>

<main>
<section class="intro" id="intro">
  <div class="intro-copy">
    <p class="eyebrow" data-i18n="intro.eyebrow">GAME VISUAL DESIGNER / 2019—NOW</p>
    <h1><span>Echo</span><br><em>Wang</em></h1>
    <p class="intro-sub" data-i18n="intro.sub">Game visual design, publishing and IP campaigns.</p>
    <div class="intro-actions">
      <button class="primary-button" id="enterBtn"><span data-i18n="intro.enterWorld">ENTER MY WORLD</span><b>↗</b></button>
      <button class="text-button" id="browseBtn" data-i18n="intro.browse">BROWSE WORK</button>
    </div>
    <p class="micro" data-i18n="intro.micro">A playable portfolio by Echo Wang.</p>
  </div>
  <div class="hero-character" aria-hidden="true">
    <div class="hero-glow"></div>
    <img src="assets/character/front.png" alt="">
    <div class="hero-caption"><span>01</span><span>ECHO / PLAYER</span></div>
  </div>
  <div class="intro-rule" aria-hidden="true"><span></span><i></i><span></span></div>
</section>

<section class="game" id="game" aria-hidden="true">
  <div class="game-topbar">
    <div>
      <p class="eyebrow">ECHO WORLD / PORTFOLIO GAME</p>
      <p class="game-title" data-i18n="game.title">Walk through my work.</p>
    </div>
    <div class="game-actions">
      <button id="mapBtn" data-i18n="nav.projects">PROJECTS</button>
      <button id="gameAboutBtn" data-i18n="nav.about">ABOUT</button>
    </div>
  </div>
  <div class="game-viewport" id="gameViewport" tabindex="0" aria-label="Interactive portfolio world">
    <div class="world-track" id="worldTrack">
      <div class="world-background" id="worldBackground" aria-hidden="true"></div>
      <div class="world-vignette" aria-hidden="true"></div>
      <div class="world-clouds" aria-hidden="true"></div>
      <div class="ground-shadow" aria-hidden="true"></div>
      <div class="platforms" id="platforms"></div>
      <div class="portals" id="portals"></div>
      <div class="world-player" id="player" aria-label="Echo">
        <img src="assets/character/side.png" alt="">
        <span class="player-shadow"></span>
      </div>
    </div>
    <div class="world-ui">
      <div class="progress"><span id="progressFill"></span></div>
      <div class="world-hint" id="worldHint">← → / A D &nbsp; · &nbsp; SPACE &nbsp; · &nbsp; E</div>
      <div class="near-hint" id="nearHint"><span>ENTER</span></div>
    </div>
    <div class="mobile-controls" aria-label="Mobile controls">
      <button data-control="left" aria-label="Move left">←</button>
      <button data-control="jump" aria-label="Jump">↑</button>
      <button data-control="right" aria-label="Move right">→</button>
    </div>
    <div class="touch-note" data-i18n="game.mobile">Swipe to explore · tap a portal</div>
  </div>
</section>
</main>

<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-backdrop" data-close></div>
  <div class="panel-sheet">
    <div class="panel-head">
      <div><p class="panel-index" id="panelIndex">01 / SELECTED</p><p class="panel-location" id="panelLocation">ECHO WORLD</p></div>
      <button class="close" data-close>ESC <span>×</span></button>
    </div>
    <div class="panel-scroll" id="panelContent"></div>
  </div>
</aside>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
